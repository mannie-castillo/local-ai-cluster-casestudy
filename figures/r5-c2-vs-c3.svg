<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
  <title id="t">R5 pilot: correct answers out of five answerable cases per model, evidence supplied versus real retrieval</title>
  <desc id="d">With correct evidence supplied (C2) every model scored 4 of 5. Through real Open WebUI retrieval (C3) Hermes 3 8B and Gemma 3 12B scored 4 of 5, Llama 3.1 8B 3 of 5, and Qwen3 14B 1 of 5 because it completed only 1 of its 6 C3 requests within the 300 second limit: 1 timed out, 4 were not launched. The conflicting-documents case was missed by all four in C2 and by all three that attempted it in C3.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #F4F8FF; }
    .t { font-size: 18px; font-weight: 700; }
    .sub { font-size: 13px; fill: #C8DAED; }
    .n { font-size: 14px; font-weight: 700; }
    .s { font-size: 12.5px; fill: #C8DAED; }
    .s1 { font-size: 12.5px; fill: #F4F8FF; }
    .v { font-size: 14px; font-weight: 700; }
    .big { font-size: 24px; font-weight: 700; }
    .k { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; fill: #16B8D8; }
    .ko { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; fill: #F28A45; }
    .ax { font-size: 12px; fill: #C8DAED; }
    .grid { stroke: #295176; stroke-width: 1; }
    .base { stroke: #C8DAED; stroke-width: 1; }
    .panel { fill: #102C49; stroke: #295176; stroke-width: 1.5; }
    .panel.cy { stroke: #16B8D8; }
    .panel.or { stroke: #F28A45; stroke-dasharray: 6 4; }
    .panel.ar { stroke: #C8DAED; fill: #0C2038; }
    .panel.dash { stroke: #16B8D8; stroke-dasharray: 6 4; }
    .bus { stroke: #16B8D8; stroke-width: 2.5; }
    .link { stroke: #16B8D8; stroke-width: 1.5; }
    .link.d { stroke-dasharray: 6 4; }
    .link.q { stroke: #2678DC; stroke-dasharray: 3 3; fill: none; }
    .lan { fill: none; stroke: #295176; stroke-width: 1.5; stroke-dasharray: 8 6; }
    .wan { fill: none; stroke: #F28A45; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .ar { stroke: #16B8D8; stroke-width: 2; fill: none; marker-end: url(#a); }
  </style>
  <rect width="760" height="430" fill="#081827"/>
  <text x="20" y="30" class="t">R5 pilot: correct answers of 5, evidence supplied vs real retrieval</text>
  <text x="20" y="50" class="sub">C2 hands the model the correct passages. C3 retrieves them through Open WebUI. 300 s limit, one model per node.</text>
  <defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#F28A45" stroke-width="2"/></pattern>
  </defs>
  <rect x="20" y="62" width="12" height="12" rx="3" fill="#2678DC"/><text x="38" y="73" class="s1">C2, evidence supplied</text>
  <rect x="200" y="62" width="12" height="12" rx="3" fill="#F28A45"/><text x="218" y="73" class="s1">C3, Open WebUI retrieval</text>
  <rect x="20" y="82" width="12" height="12" rx="3" fill="url(#hatch)" stroke="#F28A45"/><text x="38" y="93" class="s1">Hatched: answerable cases not completed in C3 (Qwen, 4 of 5)</text>
  <line x1="60" x2="740" y1="300" y2="300" class="base"/><text x="52" y="304" class="ax" text-anchor="end">0</text>
  <line x1="60" x2="740" y1="262" y2="262" class="grid"/><text x="52" y="266" class="ax" text-anchor="end">1</text>
  <line x1="60" x2="740" y1="224" y2="224" class="grid"/><text x="52" y="228" class="ax" text-anchor="end">2</text>
  <line x1="60" x2="740" y1="186" y2="186" class="grid"/><text x="52" y="190" class="ax" text-anchor="end">3</text>
  <line x1="60" x2="740" y1="148" y2="148" class="grid"/><text x="52" y="152" class="ax" text-anchor="end">4</text>
  <line x1="60" x2="740" y1="110" y2="110" class="grid"/><text x="52" y="114" class="ax" text-anchor="end">5</text>
  <rect x="98" y="148" width="44" height="152" rx="3" fill="#2678DC"/><text x="120" y="140" class="v" text-anchor="middle">4</text>
  <rect x="148" y="148" width="44" height="152" rx="3" fill="#F28A45"/><text x="170" y="140" class="v" text-anchor="middle">4</text>
  <text x="145" y="322" class="s1" text-anchor="middle" style="font-weight:700">Hermes 3 8B</text>
  <text x="145" y="338" class="s" text-anchor="middle">G3-4, 32 GB DDR4-2400</text>
  <text x="145" y="354" class="s" text-anchor="middle">6 of 6 C3 completed</text>
  <rect x="268" y="148" width="44" height="152" rx="3" fill="#2678DC"/><text x="290" y="140" class="v" text-anchor="middle">4</text>
  <rect x="318" y="148" width="44" height="152" rx="3" fill="#F28A45"/><text x="340" y="140" class="v" text-anchor="middle">4</text>
  <text x="315" y="322" class="s1" text-anchor="middle" style="font-weight:700">Gemma 3 12B</text>
  <text x="315" y="338" class="s" text-anchor="middle">G3-6, 24 GB DDR4-2400</text>
  <text x="315" y="354" class="s" text-anchor="middle">6 of 6 C3 completed</text>
  <rect x="438" y="148" width="44" height="152" rx="3" fill="#2678DC"/><text x="460" y="140" class="v" text-anchor="middle">4</text>
  <rect x="488" y="186" width="44" height="114" rx="3" fill="#F28A45"/><text x="510" y="178" class="v" text-anchor="middle">3</text>
  <text x="485" y="322" class="s1" text-anchor="middle" style="font-weight:700">Llama 3.1 8B</text>
  <text x="485" y="338" class="s" text-anchor="middle">G3-5, 16 GB DDR4-2400</text>
  <text x="485" y="354" class="s" text-anchor="middle">6 of 6 C3 completed</text>
  <rect x="608" y="148" width="44" height="152" rx="3" fill="#2678DC"/><text x="630" y="140" class="v" text-anchor="middle">4</text>
  <rect x="658" y="262" width="44" height="38" rx="3" fill="#F28A45"/><text x="680" y="288" class="v" text-anchor="middle" style="fill:#081827">1</text>
  <rect x="658" y="110" width="44" height="152" rx="3" fill="url(#hatch)" stroke="#F28A45" stroke-width="1"/>
  <text x="680" y="102" class="ko" text-anchor="middle">TIMED OUT</text>
  <text x="655" y="322" class="s1" text-anchor="middle" style="font-weight:700">Qwen3 14B</text>
  <text x="655" y="338" class="s" text-anchor="middle">G3-2, 16 GB DDR4-2400</text>
  <text x="655" y="354" class="s" text-anchor="middle">1 of 6 C3 completed</text>
  <text x="20" y="384" class="s">Counts are over the 5 answerable cases. Qwen's full C3 run: 1 of 6 requests completed, 1 timed out (300 s), 4 not launched.</text>
  <text x="20" y="402" class="s">Conflicting-documents case: missed by all four in C2 and by all three that attempted it in C3. Qwen never reached it in C3.</text>
  <text x="20" y="420" class="ko">THE CONFLICT CASE DEFEATED EVERY MODEL EVEN WITH THE RIGHT EVIDENCE IN HAND.</text>
</svg>
