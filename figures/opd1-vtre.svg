  <text x="178" y="169" class="s1" text-anchor="end" style="font-weight:700">Hermes 3 8B</text>
  <text x="178" y="183" class="s" text-anchor="end" style="font-size:11.5px">G3-4, 32 GB DDR4-2400</text>
  <rect x="190" y="196" width="117" height="26" rx="3" fill="#2678DC"/>
