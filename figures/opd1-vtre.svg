  <text x="492" y="134" class="v">0.35</text>
  <text x="178" y="129" class="s1" text-anchor="end" style="font-weight:700">Qwen3 14B</text>
  <text x="178" y="143" class="s" text-anchor="end" style="font-size:11.5px">G3-2, 16 GB DDR4-2400</text>
  <rect x="190" y="156" width="208" height="26" rx="3" fill="#2678DC"/>
