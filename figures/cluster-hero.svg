<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Local AI cluster: seven refurbished mini PCs as peers on an offline network, managed from one control machine</title>
  <desc id="d">Hero graphic. Six HP ProDesk minis (G3-1 to G3-6) and one Dell OptiPlex sit as peers on one private local network with the WAN port unplugged, managed by a separate control laptop that is never a worker. Each tile shows the node memory size and DDR4 speed. Four controlled experiments, evidence hash-checked with exceptions disclosed.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #F4F8FF; }
    .t { font-size: 18px; font-weight: 700; }
    .sub { font-size: 13px; fill: #C8DAED; }
    .n { font-size: 14px; font-weight: 700; }
    .s { font-size: 12.5px; fill: #C8DAED; }
    .s1 { font-size: 12.5px; fill: #F4F8FF; }
    .v { font-size: 14px; font-weight: 700; }
    .big { font-size: 24px; font-weight: 700; }
    .k { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; fill: #16B8D8; }
    .ko { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; fill: #F28A45; }
    .ax { font-size: 12px; fill: #C8DAED; }
    .grid { stroke: #295176; stroke-width: 1; }
    .base { stroke: #C8DAED; stroke-width: 1; }
    .panel { fill: #102C49; stroke: #295176; stroke-width: 1.5; }
    .panel.cy { stroke: #16B8D8; }
    .panel.or { stroke: #F28A45; stroke-dasharray: 6 4; }
    .panel.ar { stroke: #C8DAED; fill: #0C2038; }
    .panel.dash { stroke: #16B8D8; stroke-dasharray: 6 4; }
    .bus { stroke: #16B8D8; stroke-width: 2.5; }
    .link { stroke: #16B8D8; stroke-width: 1.5; }
    .link.d { stroke-dasharray: 6 4; }
    .link.q { stroke: #2678DC; stroke-dasharray: 3 3; fill: none; }
    .lan { fill: none; stroke: #295176; stroke-width: 1.5; stroke-dasharray: 8 6; }
    .wan { fill: none; stroke: #F28A45; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .ar { stroke: #16B8D8; stroke-width: 2; fill: none; marker-end: url(#a); }
  </style>
  <rect width="1200" height="400" fill="#081827"/>
  <text x="60" y="78" class="k" style="font-size:12.5px;letter-spacing:0.14em">LOCAL AI CLUSTER  /  CASE STUDY</text>
  <text x="60" y="130" style="font-size:40px;font-weight:700;letter-spacing:-0.01em">Measuring useful work</text>
  <text x="60" y="176" style="font-size:40px;font-weight:700;letter-spacing:-0.01em">on refurbished mini PCs</text>
  <text x="60" y="212" style="font-size:18px;fill:#C8DAED">Seven CPU-only nodes. No internet uplink.</text>
  <text x="60" y="238" style="font-size:18px;fill:#C8DAED">Four controlled experiments. Hash-checked evidence, exceptions disclosed.</text>
  <text x="60" y="290" class="k" style="font-size:13px">7</text><text x="80" y="290" class="s">nodes, 35 W each, no GPU</text>
  <text x="60" y="318" class="k" style="font-size:13px">4</text><text x="80" y="318" class="s">experiments, evidence hash-checked (exceptions disclosed)</text>
  <text x="60" y="346" class="s">No internet uplink. WAN port unplugged (operator check).</text>
  <g transform="translate(640,70)">
    <rect x="175" y="0" width="160" height="44" rx="6" class="panel cy"/>
    <text x="255" y="19" class="n" text-anchor="middle" style="font-size:13px">Control machine</text>
    <text x="255" y="34" class="s" text-anchor="middle" style="font-size:11.5px">HP Envy, never a worker</text>
    <line x1="255" y1="44" x2="255" y2="78" class="link"/>
    <line x1="10" y1="78" x2="500" y2="78" class="bus"/>
    <text x="500" y="70" class="s" text-anchor="end" style="font-size:11.5px">private LAN, 1 Gbps, all seven as peers</text>
    <rect x="10" y="104" width="64" height="66" rx="5" class="panel dash"/>
    <line x1="42" y1="78" x2="42" y2="104" class="link"/>
    <circle cx="19" cy="113" r="2.5" fill="#16B8D8"/>
    <text x="42" y="131" class="n" text-anchor="middle" style="font-size:13px">G3-1</text>
    <text x="42" y="146" class="s" text-anchor="middle" style="font-size:10.5px">32 GB</text>
    <text x="42" y="160" class="s" text-anchor="middle" style="font-size:10.5px">DDR4-2400</text>
    <rect x="80" y="104" width="64" height="66" rx="5" class="panel "/>
    <line x1="112" y1="78" x2="112" y2="104" class="link"/>
    <circle cx="89" cy="113" r="2.5" fill="#16B8D8"/>
    <text x="112" y="131" class="n" text-anchor="middle" style="font-size:13px">G3-2</text>
    <text x="112" y="146" class="s" text-anchor="middle" style="font-size:10.5px">16 GB</text>
    <text x="112" y="160" class="s" text-anchor="middle" style="font-size:10.5px">DDR4-2400</text>
    <rect x="150" y="104" width="64" height="66" rx="5" class="panel cy"/>
    <line x1="182" y1="78" x2="182" y2="104" class="link"/>
    <circle cx="159" cy="113" r="2.5" fill="#16B8D8"/>
    <text x="182" y="131" class="n" text-anchor="middle" style="font-size:13px">G3-3</text>
    <text x="182" y="146" class="s" text-anchor="middle" style="font-size:10.5px">16 GB</text>
    <text x="182" y="160" class="s" text-anchor="middle" style="font-size:10.5px">DDR4-2133</text>
    <rect x="220" y="104" width="64" height="66" rx="5" class="panel "/>
    <line x1="252" y1="78" x2="252" y2="104" class="link"/>
    <circle cx="229" cy="113" r="2.5" fill="#16B8D8"/>
    <text x="252" y="131" class="n" text-anchor="middle" style="font-size:13px">G3-4</text>
    <text x="252" y="146" class="s" text-anchor="middle" style="font-size:10.5px">32 GB</text>
    <text x="252" y="160" class="s" text-anchor="middle" style="font-size:10.5px">DDR4-2400</text>
    <rect x="290" y="104" width="64" height="66" rx="5" class="panel "/>
    <line x1="322" y1="78" x2="322" y2="104" class="link"/>
    <circle cx="299" cy="113" r="2.5" fill="#16B8D8"/>
    <text x="322" y="131" class="n" text-anchor="middle" style="font-size:13px">G3-5</text>
    <text x="322" y="146" class="s" text-anchor="middle" style="font-size:10.5px">16 GB</text>
    <text x="322" y="160" class="s" text-anchor="middle" style="font-size:10.5px">DDR4-2400</text>
    <rect x="360" y="104" width="64" height="66" rx="5" class="panel "/>
    <line x1="392" y1="78" x2="392" y2="104" class="link"/>
    <circle cx="369" cy="113" r="2.5" fill="#16B8D8"/>
    <text x="392" y="131" class="n" text-anchor="middle" style="font-size:13px">G3-6</text>
    <text x="392" y="146" class="s" text-anchor="middle" style="font-size:10.5px">24 GB</text>
    <text x="392" y="160" class="s" text-anchor="middle" style="font-size:10.5px">DDR4-2400</text>
    <rect x="430" y="104" width="64" height="66" rx="5" class="panel ar"/>
    <line x1="462" y1="78" x2="462" y2="104" class="link"/>
    <circle cx="439" cy="113" r="2.5" fill="#16B8D8"/>
    <text x="462" y="131" class="n" text-anchor="middle" style="font-size:13px">Dell</text>
    <text x="462" y="146" class="s" text-anchor="middle" style="font-size:10.5px">16 GB</text>
    <text x="462" y="160" class="s" text-anchor="middle" style="font-size:10.5px">DDR4-2400</text>
    <g transform="translate(10,200)">
      <rect x="0" y="0" width="120" height="46" rx="5" class="wan"/>
      <text x="60" y="20" class="s" text-anchor="middle" style="font-size:11.5px">Router WAN port</text>
      <text x="60" y="36" class="ko" text-anchor="middle">UNPLUGGED</text>
    </g>
    <text x="150" y="212" class="s" style="font-size:11.5px">Six HP ProDesk 600 G3 minis (i7-7700T)</text>
    <text x="150" y="228" class="s" style="font-size:11.5px">and one Dell OptiPlex 5050 (i5-7500T)</text>
    <text x="150" y="244" class="s" style="font-size:11.5px">Dell: cold model archive in progress, no inference</text>
  </g>
</svg>
